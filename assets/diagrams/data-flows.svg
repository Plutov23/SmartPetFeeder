<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">SmartPetFeeder 四条数据链路</title>
  <desc id="desc">分别展示传感数据、远程控制、视觉状态和视频画面的传输路径。</desc>
  <defs>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#23856d"/></marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#c56a22"/></marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#76509b"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#3576a8"/></marker>
    <style>
      .title { font: 700 42px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #102a43; }
      .subtitle { font: 400 20px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #627d98; }
      .lane-name { font: 700 24px "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      .node { font: 600 20px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #243b53; }
      .note { font: 400 17px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #486581; }
      .protocol { font: 600 15px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #334e68; }
    </style>
  </defs>
  <rect width="1600" height="980" fill="#f8faf8"/>
  <text x="70" y="72" class="title">四条数据链路</text>
  <text x="70" y="108" class="subtitle">先判断故障属于哪条链路，再逐个验证边界</text>

  <rect x="55" y="150" width="1490" height="170" rx="26" fill="#edf8f4" stroke="#87c8b5" stroke-width="2"/>
  <rect x="55" y="150" width="190" height="170" rx="26" fill="#d8f0e8"/>
  <text x="150" y="220" text-anchor="middle" class="lane-name" fill="#176b58">01</text>
  <text x="150" y="258" text-anchor="middle" class="lane-name" fill="#176b58">传感上报</text>
  <rect x="285" y="195" width="220" height="75" rx="16" fill="#fff" stroke="#4fa68d" stroke-width="2"/>
  <text x="395" y="241" text-anchor="middle" class="node">传感器</text>
  <rect x="600" y="195" width="220" height="75" rx="16" fill="#fff" stroke="#4fa68d" stroke-width="2"/>
  <text x="710" y="241" text-anchor="middle" class="node">STM32</text>
  <rect x="915" y="195" width="220" height="75" rx="16" fill="#fff" stroke="#4fa68d" stroke-width="2"/>
  <text x="1025" y="241" text-anchor="middle" class="node">OneNET</text>
  <rect x="1230" y="195" width="220" height="75" rx="16" fill="#fff" stroke="#4fa68d" stroke-width="2"/>
  <text x="1340" y="241" text-anchor="middle" class="node">微信小程序</text>
  <path d="M505 232 L600 232 M820 232 L915 232 M1135 232 L1230 232" stroke="#23856d" stroke-width="4" fill="none" marker-end="url(#green-arrow)"/>
  <text x="552" y="212" text-anchor="middle" class="protocol">GPIO / I2C</text>
  <text x="867" y="212" text-anchor="middle" class="protocol">MQTT</text>
  <text x="1182" y="212" text-anchor="middle" class="protocol">HTTPS</text>
  <text x="285" y="295" class="note">温度 · 湿度 · 重量 · 健康记录</text>

  <rect x="55" y="350" width="1490" height="170" rx="26" fill="#fff5ea" stroke="#e0ad77" stroke-width="2"/>
  <rect x="55" y="350" width="190" height="170" rx="26" fill="#fde6cf"/>
  <text x="150" y="420" text-anchor="middle" class="lane-name" fill="#a95318">02</text>
  <text x="150" y="458" text-anchor="middle" class="lane-name" fill="#a95318">远程控制</text>
  <rect x="285" y="395" width="220" height="75" rx="16" fill="#fff" stroke="#d88443" stroke-width="2"/>
  <text x="395" y="441" text-anchor="middle" class="node">微信小程序</text>
  <rect x="600" y="395" width="220" height="75" rx="16" fill="#fff" stroke="#d88443" stroke-width="2"/>
  <text x="710" y="441" text-anchor="middle" class="node">OneNET</text>
  <rect x="915" y="395" width="220" height="75" rx="16" fill="#fff" stroke="#d88443" stroke-width="2"/>
  <text x="1025" y="441" text-anchor="middle" class="node">STM32</text>
  <rect x="1230" y="395" width="220" height="75" rx="16" fill="#fff" stroke="#d88443" stroke-width="2"/>
  <text x="1340" y="441" text-anchor="middle" class="node">电机 / 计划</text>
  <path d="M505 432 L600 432 M820 432 L915 432 M1135 432 L1230 432" stroke="#c56a22" stroke-width="4" fill="none" marker-end="url(#orange-arrow)"/>
  <text x="552" y="412" text-anchor="middle" class="protocol">HTTPS</text>
  <text x="867" y="412" text-anchor="middle" class="protocol">MQTT</text>
  <text x="1182" y="412" text-anchor="middle" class="protocol">TIM3 / GPIO</text>
  <text x="285" y="495" class="note">手动出粮 · 定时计划 · 属性设置回复</text>

  <rect x="55" y="550" width="1490" height="170" rx="26" fill="#f6f0fa" stroke="#b89acb" stroke-width="2"/>
  <rect x="55" y="550" width="190" height="170" rx="26" fill="#e9dcf1"/>
  <text x="150" y="620" text-anchor="middle" class="lane-name" fill="#684487">03</text>
  <text x="150" y="658" text-anchor="middle" class="lane-name" fill="#684487">视觉状态</text>
  <rect x="365" y="595" width="260" height="75" rx="16" fill="#fff" stroke="#9069ad" stroke-width="2"/>
  <text x="495" y="641" text-anchor="middle" class="node">MaixCam + YOLOv5</text>
  <rect x="775" y="595" width="260" height="75" rx="16" fill="#fff" stroke="#9069ad" stroke-width="2"/>
  <text x="905" y="641" text-anchor="middle" class="node">STM32 事件状态机</text>
  <rect x="1185" y="595" width="260" height="75" rx="16" fill="#fff" stroke="#9069ad" stroke-width="2"/>
  <text x="1315" y="641" text-anchor="middle" class="node">健康记录</text>
  <path d="M625 632 L775 632 M1035 632 L1185 632" stroke="#76509b" stroke-width="4" fill="none" marker-end="url(#purple-arrow)"/>
  <text x="700" y="612" text-anchor="middle" class="protocol">UART2 · TARGET,STATUS</text>
  <text x="1110" y="612" text-anchor="middle" class="protocol">时间 + 重量差</text>
  <text x="365" y="695" class="note">EATING 开始计时，NONE 结束并上报</text>

  <rect x="55" y="750" width="1490" height="170" rx="26" fill="#edf5fb" stroke="#94b9d4" stroke-width="2"/>
  <rect x="55" y="750" width="190" height="170" rx="26" fill="#dcecf7"/>
  <text x="150" y="820" text-anchor="middle" class="lane-name" fill="#2d668e">04</text>
  <text x="150" y="858" text-anchor="middle" class="lane-name" fill="#2d668e">局域网视频</text>
  <rect x="365" y="795" width="260" height="75" rx="16" fill="#fff" stroke="#5f94b9" stroke-width="2"/>
  <text x="495" y="841" text-anchor="middle" class="node">MaixCam 摄像头</text>
  <rect x="775" y="795" width="260" height="75" rx="16" fill="#fff" stroke="#5f94b9" stroke-width="2"/>
  <text x="905" y="841" text-anchor="middle" class="node">Base64 JPEG</text>
  <rect x="1185" y="795" width="260" height="75" rx="16" fill="#fff" stroke="#5f94b9" stroke-width="2"/>
  <text x="1315" y="841" text-anchor="middle" class="node">微信小程序</text>
  <path d="M625 832 L775 832 M1035 832 L1185 832" stroke="#3576a8" stroke-width="4" fill="none" marker-end="url(#blue-arrow)"/>
  <text x="700" y="812" text-anchor="middle" class="protocol">JPEG 压缩</text>
  <text x="1110" y="812" text-anchor="middle" class="protocol">WebSocket</text>
  <text x="365" y="895" class="note">不经过 STM32 和 OneNET，仅用于同一局域网演示</text>
</svg>
